services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_KEY_SECRET=${JWT_KEY_SECRET}
      - NODE_ENV=${NODE_ENV:-development}
      # Exposto no /health; o deploy-develop já grava GIT_COMMIT no .env.
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-sftp}
      - SFTP_HOST=${SFTP_HOST:-192.168.56.130}
      - SFTP_PORT=${SFTP_PORT:-22}
      - SFTP_USER=${SFTP_USER:-wagner}
      - SFTP_PRIVATE_KEY_PATH=/app/secrets/boletins_ssh_key
      - SFTP_BASE_DIR=${SFTP_BASE_DIR:-/srv/boletins}
      - PUBLIC_BOLETINS_BASE_URL=${PUBLIC_BOLETINS_BASE_URL:-http://192.168.56.130/boletins}
      - MAX_PDF_BYTES=${MAX_PDF_BYTES:-26214400}
      - SITE_SNAPSHOT_LOCAL_DIR=/data/snapshots
    volumes:
      - uploads_data:/app/uploads
      - ${SFTP_KEY_HOST_PATH:-/home/wagner/secrets/boletins_ssh_key}:/app/secrets/boletins_ssh_key:ro
      - site_snapshots:/data/snapshots
    restart: unless-stopped

  site-publico:
    build:
      context: .
      dockerfile: frontend/Dockerfile.site
    ports:
      - "8081:80"
    volumes:
      - site_snapshots:/app/public-site-snapshots
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  uploads_data:
  site_snapshots:
