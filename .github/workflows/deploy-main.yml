name: Deploy → Main (GCP VM + Firebase Hosting)

on:
  push:
    branches: [main]

jobs:
  # 1) Build do backend fora da VM (e2-micro não tem RAM para buildar TS).
  build-backend:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # necessário para Workload Identity Federation
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Autenticar no GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_GITHUB }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build e push do backend
        run: |
          IMG=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/prosports/backend:${{ github.sha }}
          docker build -t "$IMG" ./backend
          docker push "$IMG"

  # 2) Build do frontend e deploy no Firebase Hosting (paralelo ao backend).
  deploy-frontend:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # necessário para Workload Identity Federation
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar deps do frontend
        run: cd frontend && npm ci

      - name: Build do frontend
        env:
          VITE_API_URL: https://${{ secrets.CADDY_API_DOMAIN }}
          APP_COMMIT: ${{ github.sha }}
        run: cd frontend && npm run build

      - name: Autenticar GCP via WIF (Firebase)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_FIREBASE }}

      # Binário standalone com versão fixa: o `npm install -g firebase-tools`
      # não trava as dependências transitivas (google-auth-library/gaxios), e uma
      # delas regrediu o suporte a credenciais WIF/ADC (external_account), causando
      # "Failed to authenticate" mesmo com GOOGLE_APPLICATION_CREDENTIALS setado.
      # O binário standalone empacota as deps na versão do release.
      - name: Instalar Firebase CLI (binário standalone, versão fixa)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/firebase" https://github.com/firebase/firebase-tools/releases/download/v15.22.1/firebase-tools-linux
          chmod +x "$RUNNER_TEMP/firebase"
          sudo mv "$RUNNER_TEMP/firebase" /usr/local/bin/firebase
          firebase --version

      - name: Deploy Firebase Hosting
        working-directory: ./frontend
        run: firebase deploy --only hosting:admin --project ${{ secrets.GCP_PROJECT }} --non-interactive

  # 3) Deploy do backend na VM: pull, migrations, up.
  #    Runner self-hosted roda dentro da própria VM.
  deploy-backend:
    needs: build-backend
    runs-on: [self-hosted, gcp]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Gerar .env
        run: |
          cat > .env << EOF
          GCP_REGION=${{ secrets.GCP_REGION }}
          GCP_PROJECT=${{ secrets.GCP_PROJECT }}
          IMAGE_TAG=${{ github.sha }}
          INSTANCE_CONNECTION_NAME=${{ secrets.INSTANCE_CONNECTION_NAME }}
          PROD_DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
          PROD_JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          PROD_JWT_REFRESH_SECRET=${{ secrets.PROD_JWT_REFRESH_SECRET }}
          CADDY_API_DOMAIN=${{ secrets.CADDY_API_DOMAIN }}
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          GITHUB_PAT=${{ secrets.SITE_GH_PAT }}
          GITHUB_REPO=wmarrane/prosports
          GITHUB_SNAPSHOT_BRANCH=develop
          GCS_DOCS_BUCKET=${{ secrets.GCS_DOCS_BUCKET }}
          PUBLIC_DOCS_BASE_URL=${{ secrets.PUBLIC_DOCS_BASE_URL }}
          EOF

      - name: Autenticar Docker no Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Pull das imagens
        run: docker compose -f docker-compose.prod.yml pull

      - name: Subir proxy e Redis
        run: docker compose -f docker-compose.prod.yml up -d cloud-sql-proxy redis

      - name: Rodar migrations do Prisma
        run: |
          for i in $(seq 1 10); do
            if docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy; then
              echo "Migrations aplicadas."
              exit 0
            fi
            echo "Proxy/DB ainda não pronto — tentativa $i/10"; sleep 3
          done
          echo "Falha ao aplicar migrations."; exit 1

      - name: Subir backend + Caddy
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Ajustar dono do volume de uploads (idempotente)
        run: docker compose -f docker-compose.prod.yml exec -T -u root backend chown -R node:node /app/uploads

      - name: Limpar imagens antigas
        run: docker image prune -f
