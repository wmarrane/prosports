name: Deploy → Develop (Local)

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: [self-hosted, dev]
    environment: develop

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Criar .env
        run: |
          cat > .env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=redis://redis:6379
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          NODE_ENV=development
          CORS_ORIGINS=http://192.168.56.113:8080,http://192.168.1.10:8080,http://localhost:8080,http://localhost:5173
          GIT_COMMIT=$(git rev-parse --short HEAD)
          EOF

      - name: Instalar dependências do backend
        run: cd backend && npm ci

      - name: Rodar migrations Prisma
        run: cd backend && DATABASE_URL=${{ secrets.DATABASE_URL }} npx prisma migrate deploy

      # A chave SFTP dos boletins é montada direto do caminho permanente da VM
      # (SFTP_KEY_HOST_PATH no docker-compose.yml, default /home/wagner/secrets/boletins_ssh_key),
      # fora do workspace do git — o checkout nunca a apaga e o Docker nunca cria um
      # diretório root no lugar (evita o EACCES no checkout após reinício da VM).
      - name: Build e subir containers
        run: docker compose up -d --build --remove-orphans

      - name: Ajustar dono do volume de uploads (idempotente)
        run: docker compose exec -T -u root backend chown -R node:node /app/uploads

      - name: Limpar imagens antigas
        run: docker image prune -f

      - name: Limpar build cache (mantém 1GB recente)
        run: docker builder prune -f --keep-storage 1GB

      - name: Limpar networks/containers órfãos
        run: docker system prune -f
