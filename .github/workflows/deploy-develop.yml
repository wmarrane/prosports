name: Deploy → Develop (Local)

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: [self-hosted, dev]
    environment: develop

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Criar .env
        run: |
          cat > .env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=redis://redis:6379
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          NODE_ENV=development
          CORS_ORIGINS=http://192.168.56.113:8080,http://192.168.1.10:8080,http://localhost:8080,http://localhost:5173
          GIT_COMMIT=$(git rev-parse --short HEAD)
          EOF

      - name: Instalar dependências do backend
        run: cd backend && npm ci

      - name: Rodar migrations Prisma
        run: cd backend && DATABASE_URL=${{ secrets.DATABASE_URL }} npx prisma migrate deploy

      - name: Provisionar chave SFTP dos boletins
        # A chave é gitignored e o checkout (clean) apaga secrets/ a cada deploy;
        # copia do caminho estável no host do runner para o workspace antes do compose.
        run: |
          mkdir -p secrets
          cp /home/wagner/secrets/boletins_ssh_key secrets/boletins_ssh_key
          chmod 600 secrets/boletins_ssh_key

      - name: Build e subir containers
        run: docker compose up -d --build --remove-orphans

      - name: Limpar imagens antigas
        run: docker image prune -f

      - name: Limpar build cache (mantém 1GB recente)
        run: docker builder prune -f --keep-storage 1GB

      - name: Limpar networks/containers órfãos
        run: docker system prune -f
