name: Build Site Público

on:
  repository_dispatch:
    types: [publicar-site]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar deps
        run: cd frontend && npm ci

      - name: Build do site público
        run: cd frontend && npm run build:site

      - name: Autenticar GCP via WIF (Firebase)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_FIREBASE }}

      # Binário standalone com versão fixa: o `npm install -g firebase-tools` não
      # trava as deps transitivas (google-auth-library/gaxios); uma delas regrediu
      # o suporte a credenciais WIF/ADC, causando "Failed to authenticate".
      - name: Instalar Firebase CLI (binário standalone, versão fixa)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/firebase" https://github.com/firebase/firebase-tools/releases/download/v15.22.1/firebase-tools-linux
          chmod +x "$RUNNER_TEMP/firebase"
          sudo mv "$RUNNER_TEMP/firebase" /usr/local/bin/firebase
          firebase --version

      - name: Deploy Firebase Hosting (público)
        working-directory: ./frontend
        run: firebase deploy --only hosting:publico --project ${{ secrets.GCP_PROJECT }} --non-interactive
